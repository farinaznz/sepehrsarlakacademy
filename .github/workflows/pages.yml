name: Verify Node deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      BETTER_AUTH_SECRET: build-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_FAKE_OTP_ENABLED: "false"
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: build@example.com
      SMTP_PASSWORD: build-only-password
      SMTP_FROM: build@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test public content
        run: npm test

      - name: Build standalone Node application
        run: npm run build:standalone
